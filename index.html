<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECHO//SHIFT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080e1d;color:#eafaff;font-family:system-ui,Arial}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;font-weight:800;text-shadow:0 2px 6px #000}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#070c19d9;z-index:3}#panel{width:min(90vw,480px);padding:30px;border:1px solid #44ddff88;border-radius:20px;background:#101d35;text-align:center;box-shadow:0 0 65px #16cfff22}h1{font-size:clamp(32px,7vw,58px);margin:0;color:#67e9ff;letter-spacing:3px}p{line-height:1.6;color:#b9ccdf}button{background:#4de3f4;color:#06101a;border:0;border-radius:12px;padding:13px 24px;font-weight:900;font-size:17px;cursor:pointer}#touch{position:fixed;bottom:18px;left:18px;right:18px;display:none;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:130px;height:130px;border:2px solid #6deaff77;border-radius:50%;background:#6deaff18;position:relative;pointer-events:auto;touch-action:none}#nub{width:55px;height:55px;position:absolute;left:36px;top:36px;border-radius:50%;background:#66eaffaa}#actions{display:flex;gap:12px;pointer-events:auto}#actions button{width:80px;height:80px;border-radius:50%;padding:5px;font-size:13px;background:#172d4c;color:#a7f7ff;border:2px solid #4ce8fa}@media(pointer:coarse){#touch{display:flex}} </style></head>
<body><canvas id="game"></canvas><div id="hud"><span id="hp">♥ 100</span><span id="score">SCORE 0</span><span id="wave">WAVE 1</span></div><div id="overlay"><div id="panel"><h1>ECHO//SHIFT</h1><p>Survive the arena. Your echo clone distracts enemies.<br>WASD / arrows to move • Mouse to aim<br>SPACE dash • E deploy echo<br>On mobile use the joystick and action buttons.</p><button id="start">START RUN</button><p id="result"></p></div></div><div id="touch"><div id="stick"><div id="nub"></div></div><div id="actions"><button id="dash">DASH</button><button id="echo">ECHO</button></div></div>
<script>
const c=document.querySelector('#game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:0,y:0,active:false},joy={x:0,y:0};let p,enemies,shots,particles,clones,score,wave,spawn,last=0,running=false,elapsed=0;
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){p={x:W/2,y:H/2,r:14,hp:100,inv:0,dash:0,echo:0,fire:0};enemies=[];shots=[];particles=[];clones=[];score=0;wave=1;spawn=0;elapsed=0;running=true;document.querySelector('#overlay').style.display='none'}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-150,150),vy:rand(-150,150),life:rand(.2,.6),color})}
function dash(){if(!running||p.dash>0)return;let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y;let l=Math.hypot(x,y);if(l<.1){x=1;y=0;l=1}p.x=clamp(p.x+x/l*115,20,W-20);p.y=clamp(p.y+y/l*115,20,H-20);p.inv=.3;p.dash=2.5;burst(p.x,p.y,'#7cfaff',18)}
function echo(){if(!running||p.echo>0)return;clones.push({x:p.x,y:p.y,life:4,r:14});p.echo=7;burst(p.x,p.y,'#65f0ff',18)}
addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.code==='Space')dash();if(e.key.toLowerCase()==='e')echo()});addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});c.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
document.querySelector('#start').onclick=reset;document.querySelector('#dash').onpointerdown=e=>{e.preventDefault();dash()};document.querySelector('#echo').onpointerdown=e=>{e.preventDefault();echo()};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function moveStick(e){const r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.max(1,Math.hypot(x,y)),m=Math.min(1,l/50);joy.x=x/l*m;joy.y=y/l*m;nub.style.transform='translate('+joy.x*40+'px,'+joy.y*40+'px)'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveStick(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))moveStick(e)};function stopStick(){joy.x=joy.y=0;nub.style.transform=''}stick.onpointerup=stopStick;stick.onpointercancel=stopStick;
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function update(dt){elapsed+=dt;wave=1+Math.floor(elapsed/20);p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.echo=Math.max(0,p.echo-dt);p.fire-=dt;
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y,l=Math.hypot(dx,dy);if(l>.05){p.x=clamp(p.x+dx/l*235*dt,16,W-16);p.y=clamp(p.y+dy/l*235*dt,16,H-16)}
spawn-=dt;if(spawn<=0){let side=Math.floor(rand(0,4)),x=side===0?0:side===1?W:rand(0,W),y=side===2?0:side===3?H:rand(0,H);enemies.push({x,y,r:rand(12,19),hp:2+Math.floor(wave/3),speed:rand(65,95)+wave*7});spawn=Math.max(.3,1.2-wave*.065)}
clones=clones.filter(q=>(q.life-=dt)>0);
if(p.fire<=0&&enemies.length){let target=enemies.reduce((a,b)=>dist(p,a)<dist(p,b)?a:b);let aim=mouse.active&&matchMedia('(pointer:fine)').matches?mouse:target;let a=Math.atan2(aim.y-p.y,aim.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*530,vy:Math.sin(a)*530,life:1.25});p.fire=.19}
for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let e of enemies)if(e.hp>0&&dist(s,e)<e.r+5){e.hp--;s.life=0;burst(s.x,s.y,'#fcbf69',4);if(e.hp<=0){score+=10;burst(e.x,e.y,'#ff8c80',12)}break}}
shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);enemies=enemies.filter(e=>e.hp>0);
for(let e of enemies){let target=clones.length?clones.reduce((a,b)=>dist(e,a)<dist(e,b)?a:b):p;let a=Math.atan2(target.y-e.y,target.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(target===p&&dist(e,p)<e.r+p.r&&p.inv<=0){p.hp-=12;p.inv=.75;burst(p.x,p.y,'#ff6b83',12);if(p.hp<=0){running=false;document.querySelector('#overlay').style.display='grid';document.querySelector('#result').textContent='FINAL SCORE '+score+' • WAVE '+wave;document.querySelector('#start').textContent='PLAY AGAIN'}}}
particles=particles.filter(q=>(q.life-=dt)>0);for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt}
document.querySelector('#hp').textContent='♥ '+Math.max(0,p.hp);document.querySelector('#score').textContent='SCORE '+score;document.querySelector('#wave').textContent='WAVE '+wave}
function render(){ctx.fillStyle='#081020';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#14304a';ctx.lineWidth=1;const grid=48;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
if(!p)return;for(let q of clones){circle(q.x,q.y,q.r+8,'#45e9ff33');circle(q.x,q.y,q.r,'#65f0ff88');ctx.strokeStyle='#c4ffff';ctx.strokeRect(q.x-7,q.y-7,14,14)}
for(let s of shots){circle(s.x,s.y,7,'#4deaff');circle(s.x,s.y,3,'#ffffff')}for(let e of enemies){circle(e.x,e.y,e.r+4,'#fa476b33');circle(e.x,e.y,e.r,'#ef5875');circle(e.x-4,e.y-3,3,'#2c0a1c');circle(e.x+4,e.y-3,3,'#2c0a1c')}
for(let q of particles)circle(q.x,q.y,3,q.color);circle(p.x,p.y,24,'#50e5ff22');circle(p.x,p.y,p.r,p.inv>0?'#ffffff':'#55e4f7');circle(p.x,p.y,6,'#0b2340');ctx.fillStyle='#a9c8d5';ctx.font='12px system-ui';ctx.fillText('DASH '+(p.dash? p.dash.toFixed(1)+'s':'READY')+'   ECHO '+(p.echo?p.echo.toFixed(1)+'s':'READY'),14,H-16)}
function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(running)update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
