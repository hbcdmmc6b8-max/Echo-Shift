<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECHO//SHIFT 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#090d1c;color:white;font-family:system-ui}canvas{display:block;touch-action:none}#hud{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none}#menu{position:absolute;inset:0;background:#090e20d9;display:grid;place-items:center}#panel{padding:28px;border:1px solid #55e8ff;background:#121b32;border-radius:18px;max-width:460px;text-align:center}h1{color:#69eaff;letter-spacing:3px}button{background:#69eaff;border:0;padding:13px 20px;border-radius:12px;font-weight:900;cursor:pointer}#touch{display:none;position:absolute;bottom:22px;left:20px;right:20px;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:120px;height:120px;border-radius:50%;background:#59e8ff33;border:2px solid #65dfff;pointer-events:auto;touch-action:none;position:relative}#nub{position:absolute;top:34px;left:34px;width:50px;height:50px;background:#6befffaa;border-radius:50%}#actions{display:flex;gap:8px;pointer-events:auto}#actions button{background:#1b3354;color:white;border:1px solid #65eaff;width:66px;height:66px;border-radius:50%;padding:4px;font-size:11px}@media(pointer:coarse){#touch{display:flex}}#error{position:absolute;top:65px;color:#ff9a9a;left:20px}</style></head><body><div id="hud"><span id="hp">HP 100</span><span id="score">SCORE 0</span><span id="wave">WAVE 1</span></div><div id="error"></div><div id="menu"><div id="panel"><h1>ECHO//SHIFT 3D</h1><p>Anime-styled neon arena prototype<br>WASD move • Mouse rotate camera<br>Click / J attack • Space dodge • E echo<br>Defeat the drones and survive!</p><button id="start">START GAME</button><p id="result"></p></div></div><div id="touch"><div id="stick"><div id="nub"></div></div><div id="actions"><button id="attack">HIT</button><button id="dodge">DASH</button><button id="echo">ECHO</button></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x101a30);scene.fog=new T.FogExp2(0x101a30,.017);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0x9bdfff,0x152040,2.1));const sun=new T.DirectionalLight(0xffffff,2.5);sun.position.set(20,35,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,emissive=0x000000)=>new T.MeshStandardMaterial({color,roughness:.55,metalness:.2,emissive,emissiveIntensity:.5});const cyan=mat(0x69f4ff,0x11b8df),yellow=mat(0xffd01c),black=mat(0x192134),skin=mat(0xffc59c),hair=mat(0x1d2027),red=mat(0xff5577,0xa00030);
function cube(w,h,d,m,x=0,y=0,z=0,parent=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function ball(r,m,x,y,z,parent){const o=new T.Mesh(new T.SphereGeometry(r,12,10),m);o.position.set(x,y,z);parent.add(o);return o}
cube(240,.3,240,mat(0x17233a),0,-.2,0);const grid=new T.GridHelper(240,80,0x1e7c9b,0x24405b);grid.position.y=.01;scene.add(grid);
for(let i=0;i<90;i++){const a=i/90*Math.PI*2,r=38+Math.random()*65,x=Math.cos(a)*r,z=Math.sin(a)*r,h=8+Math.random()*38;cube(5+Math.random()*8,h,5+Math.random()*8,mat(i%3===0?0x243f65:0x263047),x,h/2,z);const strip=cube(3,.15,.08,i%2?cyan:red,x,h*.6,z+3.8);strip.material=strip.material.clone()}
for(let i=0;i<20;i++){let a=i/20*Math.PI*2;cube(2,3,2,mat(0x344967),Math.cos(a)*30,1.5,Math.sin(a)*30)}
function fighter(){const root=new T.Group();const body=new T.Group();root.add(body);cube(.86,1.18,.44,yellow,0,1.7,0,body);cube(.43,1,.5,black,0,1.72,-.28,body);cube(.28,.32,.26,skin,0,2.48,0,body);ball(.31,skin,0,2.8,0,body);const spike=new T.Mesh(new T.ConeGeometry(.35,.7,5),hair);spike.position.set(0,3.28,-.04);spike.rotation.z=-.3;body.add(spike);const arms=[],legs=[];for(const s of [-1,1]){const a=new T.Group();a.position.set(s*.56,2.14,0);body.add(a);cube(.29,.75,.32,yellow,0,-.4,0,a);ball(.16,skin,0,-.85,0,a);arms.push(a);const l=new T.Group();l.position.set(s*.23,1.12,0);body.add(l);cube(.35,.95,.38,black,0,-.48,0,l);cube(.38,.22,.65,mat(0xe3e9ef),0,-1,-.1,l);legs.push(l)}cube(.9,.1,.5,cyan,0,1.15,0,body);return {root,body,arms,legs}}
const hero=fighter();scene.add(hero.root);const keys={},joy={x:0,y:0};let yaw=0,pitch=.28,active=false,hp=100,score=0,wave=1,elapsed=0,spawn=0,atk=0,dashCd=0,echoCd=0,inv=0,walk=0,mouseDown=false,enemies=[],echoes=[],effects=[];
function flash(x,z,color=0x63efff){const o=ball(.3,new T.MeshBasicMaterial({color,transparent:true,opacity:.75}),x,1,z,scene);effects.push({o,life:.35})}
function attack(){if(!active||atk>0)return;atk=.32;hero.arms[1].rotation.x=-1.5;for(const e of enemies){if(e.position.distanceTo(hero.root.position)<3.2){e.userData.hp--;flash(e.position.x,e.position.z,0xffaa33);if(e.userData.hp<=0){scene.remove(e);score+=10}}}enemies=enemies.filter(e=>e.userData.hp>0)}
function dodge(){if(!active||dashCd>0)return;dashCd=2;inv=.45;const v=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));hero.root.position.addScaledVector(v,4);flash(hero.root.position.x,hero.root.position.z)}
function echo(){if(!active||echoCd>0)return;echoCd=7;const clone=fighter().root;clone.position.copy(hero.root.position);clone.rotation.copy(hero.root.rotation);clone.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.45;o.material.emissive=new T.Color(0x00ddff)}});scene.add(clone);echoes.push({o:clone,life:4})}
function enemy(){const a=Math.random()*Math.PI*2,r=24;const o=new T.Group();o.position.set(hero.root.position.x+Math.sin(a)*r,0,hero.root.position.z+Math.cos(a)*r);ball(.65,red,0,1.1,0,o);ball(.2,cyan,0,1.2,-.57,o);cube(1.7,.12,.3,red,0,.85,0,o);o.userData.hp=2+Math.floor(wave/3);scene.add(o);enemies.push(o)}
function reset(){for(const e of enemies)scene.remove(e);for(const e of echoes)scene.remove(e.o);enemies=[];echoes=[];hero.root.position.set(0,0,0);hp=100;score=0;wave=1;elapsed=0;spawn=0;atk=dashCd=echoCd=inv=0;active=true;document.querySelector('#menu').style.display='none'}
document.querySelector('#start').onclick=reset;document.querySelector('#attack').onpointerdown=attack;document.querySelector('#dodge').onpointerdown=dodge;document.querySelector('#echo').onpointerdown=echo;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();dodge()}if(e.code==='KeyE')echo();if(e.code==='KeyJ')attack()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(active&&matchMedia('(pointer:fine)').matches){renderer.domElement.requestPointerLock?.();attack()}});addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.003;pitch=Math.max(-.1,Math.min(.9,pitch+e.movementY*.002))}});addEventListener('mousedown',()=>mouseDown=true);addEventListener('mouseup',()=>mouseDown=false);
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function moveJoy(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-60,y=e.clientY-r.top-60,l=Math.max(1,Math.hypot(x,y)),v=Math.min(1,l/45);joy.x=x/l*v;joy.y=y/l*v;nub.style.transform='translate('+joy.x*38+'px,'+joy.y*38+'px)'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveJoy(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))moveJoy(e)};stick.onpointerup=stick.onpointercancel=()=>{joy.x=joy.y=0;nub.style.transform=''};
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(active){elapsed+=dt;wave=1+Math.floor(elapsed/25);spawn-=dt;atk=Math.max(0,atk-dt);dashCd=Math.max(0,dashCd-dt);echoCd=Math.max(0,echoCd-dt);inv=Math.max(0,inv-dt);if(spawn<=0){enemy();spawn=Math.max(.45,2-wave*.12)}
const dx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,dz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y,l=Math.hypot(dx,dz);if(l>.1){const forward=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw));hero.root.position.addScaledVector(right,dx/l*dt*7);hero.root.position.addScaledVector(forward,-dz/l*dt*7);hero.root.rotation.y=Math.atan2(dx,-dz)-yaw;walk+=dt*13;hero.legs[0].rotation.x=Math.sin(walk)*.6;hero.legs[1].rotation.x=-Math.sin(walk)*.6;hero.arms[0].rotation.x=-Math.sin(walk)*.3}else{hero.legs.forEach(o=>o.rotation.x*=.75)}hero.arms[1].rotation.x*=.85;hero.root.position.x=Math.max(-29,Math.min(29,hero.root.position.x));hero.root.position.z=Math.max(-29,Math.min(29,hero.root.position.z));
for(const e of enemies){let target=echoes.length?echoes[0].o:hero.root;const v=target.position.clone().sub(e.position);v.y=0;if(v.length()>.8)e.position.addScaledVector(v.normalize(),dt*(2.5+wave*.22));e.rotation.y=Math.atan2(v.x,v.z);if(target===hero.root&&e.position.distanceTo(hero.root.position)<1.2&&inv<=0){hp-=10;inv=.7;flash(hero.root.position.x,hero.root.position.z,0xff4466);if(hp<=0){active=false;document.querySelector('#menu').style.display='grid';document.querySelector('#result').textContent='SCORE '+score+' | WAVE '+wave;document.querySelector('#start').textContent='RESTART'}}}
echoes=echoes.filter(e=>{e.life-=dt;if(e.life<=0){scene.remove(e.o);return false}return true});effects=effects.filter(e=>{e.life-=dt;e.o.scale.multiplyScalar(1.06);e.o.material.opacity=Math.max(0,e.life*2);if(e.life<=0){scene.remove(e.o);return false}return true});document.querySelector('#hp').textContent='HP '+Math.max(0,hp);document.querySelector('#score').textContent='SCORE '+score;document.querySelector('#wave').textContent='WAVE '+wave}
const target=hero.root.position.clone().add(new T.Vector3(0,1.8,0)),offset=new T.Vector3(Math.sin(yaw)*9,5+pitch*5,Math.cos(yaw)*9);camera.position.lerp(target.clone().add(offset),.12);camera.lookAt(target);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
